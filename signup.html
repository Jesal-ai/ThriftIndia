<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Create account — ThriftIndia</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" /><link rel="stylesheet" href="account.css" /></head><body><header class="account-header"><a class="brand" href="index.html">Thrift<span>India</span></a><a class="back-link" href="index.html">← Back to browsing</a></header><main class="account-shell"><section class="auth-card"><p class="eyebrow"><span></span> Join the community</p><h1>Make your closet count.</h1><p class="auth-intro">Buy thoughtfully, sell simply, and keep great pieces in circulation.</p><button class="google-button" id="googleSignup" type="button"><span class="google-mark">G</span> Continue with Google</button><div class="or-divider">or</div><form class="account-form" id="signupForm"><label>Full name<input id="signupName" required autocomplete="name" placeholder="Your name" /></label><label>Mobile number<input id="signupPhone" required inputmode="numeric" autocomplete="tel" pattern="[0-9]{10}" placeholder="10-digit mobile number" /></label><label>Email address<input id="signupEmail" type="email" required autocomplete="email" placeholder="you@example.com" /></label><label>Password<input id="signupPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="At least 6 characters" /></label><p class="form-message" id="signupMessage"></p><button class="primary-button" type="submit">Create account →</button></form><p class="auth-switch">Already a member? <a href="login.html">Log in</a></p></section></main><script src="auth.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>

<input type="password" id="password" placeholder="Password">
<button id="signupBtn">Sign Up</button>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
<script src="config.js"></script>
<script src="signup.js"></script>
</body></html>
